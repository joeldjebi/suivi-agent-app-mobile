# Version web de l'app : app, API et temps réel sur une seule origine.
server {
  listen 80;
  server_name _;
  client_max_body_size 20m;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript text/javascript application/json application/wasm image/svg+xml font/otf font/ttf;
  # Fichiers déjà compressés au niveau maximal pendant la construction (*.br, *.gz) : servis
  # tels quels, Brotli d'abord (plus léger) pour les navigateurs qui le connaissent.
  gzip_static on;
  brotli on;
  brotli_comp_level 6;
  brotli_types text/css application/javascript text/javascript application/json application/wasm image/svg+xml font/otf font/ttf;
  brotli_static on;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  # Module JavaScript de la version WebAssembly : type absent de la liste de nginx (sans lui, le
  # navigateur refuse de le charger). Mêmes en-têtes que le reste de l'app.
  location ~* \.mjs$ {
    default_type text/javascript;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
  }

  # Les fichiers de l'app ne sont pas versionnés par leur nom : toujours revalidés, pour
  # que chaque ouverture charge la dernière version publiée. Isolation de l'origine
  # (COOP/COEP) : le moteur WebAssembly peut alors dessiner sur plusieurs fils.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    try_files $uri $uri/ /index.html;
  }
}
