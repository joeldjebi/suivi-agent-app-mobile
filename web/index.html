<!DOCTYPE html><html lang="fr"><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PerformX : journée, missions, points de vente et commandes de vos équipes terrain.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PerformX">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>PerformX</title>
  <meta name="theme-color" content="#2563EB">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #2563EB;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  <script>
    // Installation sur l'écran d'accueil : la demande du navigateur (Android, Chrome) est
    // gardée pour le bouton « Installer » de l'app.
    window.pxInstall = { event: null, installed: false };
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.pxInstall.event = e;
    });
    window.addEventListener('appinstalled', function () {
      window.pxInstall.event = null;
      window.pxInstall.installed = true;
    });
    window.pxCanPrompt = function () { return !!window.pxInstall.event; };
    window.pxPrompt = function () {
      var e = window.pxInstall.event;
      if (!e) return Promise.resolve(false);
      window.pxInstall.event = null;
      e.prompt();
      return e.userChoice.then(function (c) { return c.outcome === 'accepted'; });
    };
    window.pxStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true || window.pxInstall.installed;
    };
    // Téléphone ou tablette (la photo se prend sur place, jamais depuis un ordinateur).
    window.pxIsMobile = function () {
      return /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    };
    // Écran maintenu allumé pendant la journée : le navigateur coupe le GPS écran éteint.
    window.pxWake = { lock: null, wanted: false };
    window.pxKeepAwake = function (on) {
      window.pxWake.wanted = on;
      if (!('wakeLock' in navigator)) return;
      if (!on) {
        if (window.pxWake.lock) window.pxWake.lock.release();
        window.pxWake.lock = null;
        return;
      }
      if (window.pxWake.lock || document.visibilityState !== 'visible') return;
      navigator.wakeLock.request('screen').then(function (l) {
        window.pxWake.lock = l;
        l.addEventListener('release', function () { window.pxWake.lock = null; });
      }).catch(function () {});
    };
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && window.pxWake.wanted) window.pxKeepAwake(true);
    });
    // Notifications du navigateur (alertes de zone, page ouverte).
    window.pxNotifyPermission = function () {
      if (!('Notification' in window)) return Promise.resolve('unsupported');
      if (Notification.permission !== 'default') return Promise.resolve(Notification.permission);
      return Notification.requestPermission();
    };
    window.pxNotify = function (tag, title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return false;
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(function (r) {
            r.showNotification(title, { body: body, tag: tag, icon: 'icons/Icon-192.png', badge: 'icons/Icon-192.png' });
          });
        } else {
          new Notification(title, { body: body, tag: tag, icon: 'icons/Icon-192.png' });
        }
        return true;
      } catch (e) { return false; }
    };
    // Données gardées sur l'appareil (formulaires, positions en attente) : stockage
    // persistant demandé au navigateur.
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    // Ouverture hors connexion : la page d'accueil est mise en cache dès la première visite
    // (le service worker de l'app ne la garde sinon qu'à la visite suivante).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function () {
        setTimeout(function () { fetch('./', { cache: 'reload' }).catch(function () {}); }, 3000);
      });
    }
    window.pxIsIOS = function () {
      return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    };
  </script>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
